# Static top-level config -- checked in, never touched by fleet_deploy.py.
# The per-app server blocks are generated at deploy time into conf.d/ (a
# bind-mounted, gitignored-by-being-outside-the-repo appdata dir -- see
# compose.yaml) and picked up by the `include` below.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Fleet-wide HTTPS (Home/Fleet-HTTPS): one private-CA leaf, ~22+ SANs
    # covering every fleet name, set ONCE here so every server block in
    # conf.d/ inherits it with no per-block ssl_certificate -- that's the
    # whole design (one cert, many names, re-signed on the laptop when a
    # name is added). REQUIRED, not optional: nginx refuses to start if
    # either file is missing -- there is deliberately no port-80-only
    # fallback, so getting these two files onto the host (compose.yaml's
    # ${APPDATA_ROOT}/nginx/tls bind mount) is a precondition of this
    # container coming up at all, not a nice-to-have.
    ssl_certificate     /etc/nginx/fleet-tls/fleet.crt;
    ssl_certificate_key /etc/nginx/fleet-tls/fleet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Standard websocket-upgrade idiom (Rig-DNS-Staging-Pack §C): when a
    # request carries no Upgrade header (every plain HTTP request),
    # $http_upgrade is empty and $connection_upgrade resolves to "close" --
    # ordinary HTTP proxying is unaffected. Generated server blocks set the
    # Upgrade/Connection proxy headers unconditionally so one code path
    # handles both websocket and plain backends; this map is what makes
    # that safe.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
