# Reproduces the NAS eclipse-mosquitto default config exactly: a single
# listener on 1883, bound to loopback only (host network mode means
# "loopback" is the whole host, same as it was on the NAS), anonymous
# clients allowed -- HA and ring-mqtt both connect at mqtt://localhost:1883
# with no auth. Nothing external ever reaches this broker.
listener 1883 127.0.0.1
allow_anonymous true
# No persistence, matching the NAS (stock config): retained messages are
# republished by ring-mqtt/HA on connect; nothing here is worth a disk write.
