# home-assistant -- the household smart-home stack, a no-build vendor
# compose in fleet-vendor-stacks, deployed on robstinybox by the unified
# engine (no image: block on the stack itself; the deploy: block in
# registry.yaml points here). Verb: docker compose --env-file ~/fleet.env
# up -d --build (--build is a no-op -- no Dockerfile in this stack).
#
# Five services, four on network_mode: host (zwave-js-ui is bridged):
#   homeassistant -- the HA core. Host network because its integrations
#     (HomeKit controller, Sonos, Chromecast) rely on mDNS/SSDP discovery
#     on the LAN, which a bridge network can't pass through.
#   mosquitto -- the MQTT broker HA and ring-mqtt talk to at
#     localhost:1883. Host network so "localhost" means the same host as
#     homeassistant and ring-mqtt; see mosquitto.conf for the loopback-only
#     listener (reproduces the NAS's default-config behavior exactly).
#   ring-mqtt -- bridges Ring devices into MQTT. Host network for the same
#     localhost:1883 reason, plus go2rtc (bundled) needs LAN access for
#     camera streams.
#   matter-server -- HA's local Matter controller; rationale on the service
#     itself below.
#
# APPDATA_ROOT = local box NVMe config (HA config git checkout, ring-mqtt
# state, and since wave 9 the kitchen photo pool). MEDIA_ROOT = NAS
# /volume1/data over NFS -- HA's own Settings > Backups archives land there
# (redundant NAS disk, not the box's single NVMe).
#
# Ownership: everything under APPDATA_ROOT is chown -R svc:svc after the
# one-time migration copy (see README.md); HA runs as root *inside* its
# container regardless, so container-side ownership is unaffected.
services:
  homeassistant:
    image: homeassistant/home-assistant:2026.10.0
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: false
    environment: [TZ=America/New_York]
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in ~/fleet.env}/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_ROOT:?set MEDIA_ROOT in ~/fleet.env}/backups/home-assistant:/config/backups
      # Kitchen photo pool: written hourly by the refresh-kitchen-photos DAG,
      # which now runs alongside Immich's postgres container on this same
      # box (both moved here at waves 8/9) -- so the pool moves box-local
      # too, one NFS hop deleted (Phase 2 wave 9). Was
      # ${MEDIA_ROOT}/homeassistant/www-photos (NAS NFS) through wave 8; Rob
      # copies the current pool once (Phase2-Sitting-1 §6). Read-only from
      # HA's side.
      - ${APPDATA_ROOT:?set APPDATA_ROOT in ~/fleet.env}/homeassistant/www-photos:/config/www/photos:ro
  mosquitto:
    image: eclipse-mosquitto:2.0.14
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  ring-mqtt:
    image: tsightler/ring-mqtt:5.9.2
    container_name: ring-mqtt
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in ~/fleet.env}/ring-mqtt:/data
  # matter-server -- HA's local Matter controller (matterjs-server, the
  # successor to the archived python-matter-server). HA's Matter integration
  # talks to it over WebSocket at ws://127.0.0.1:5580/ws. Host network: Matter
  # commissioning and operation are IPv6 multicast (mDNS) + Thread-mesh
  # routing, which a bridge network can't pass. The host must also learn the
  # M100's route to the Thread mesh (sysctl accept_ra=2 +
  # accept_ra_rt_info_max_plen=64 -- the gap that sank the NAS attempt; see
  # Obsidian Home/IKEA Klippbok Water Sensors §IPv6 route). BLE commissioning
  # goes through the host's bluetoothd over D-Bus (hci0 on the box), hence
  # the /run/dbus mount + NOBLE_BINDINGS; it degrades to no-BLE if the host
  # has no bluetooth service running.
  # /data holds the fabric credentials: lose it and every paired device
  # must be factory-reset and re-paired. It sits under APPDATA_ROOT, so the
  # nightly box-backup (this entry is `backup: hot`) mirrors it to the NAS.
  # Runs as root in-container (like homeassistant): the image's default uid
  # 1000 can't write a bind mount the docker daemon creates root-owned.
  matter-server:
    image: ghcr.io/matter-js/matterjs-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      - TZ=America/New_York
      - NOBLE_BINDINGS=dbus
      - BLUETOOTH_ADAPTER=0
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in ~/fleet.env}/matter-server:/data
      - /run/dbus:/run/dbus:ro
    command: ["--storage-path", "/data", "--port", "5580"]
  # zwave-js-ui -- the Z-Wave controller for the Home Assistant Connect
  # ZWA-2 stick (SmartThings decom, Obsidian Tasks/Projects/SmartThings to
  # ZWA-2 ZBT-2 Migration). HA's Z-Wave JS integration talks to it at
  # ws://127.0.0.1:3000; the admin UI is zwave.rig (nginx -> 127.0.0.1:8091).
  # Bridge network, not host: unlike Matter it needs no multicast, and
  # publishing both ports on loopback only keeps the unauthenticated-by-
  # default UI and the control socket off the LAN. The stick is mapped by
  # its stable by-id path (ttyACM0 can renumber across reboots). /usr/src/
  # app/store holds the network keys and NVM backups: lose it and every
  # device must be re-included. Under APPDATA_ROOT so the hot box-backup
  # mirrors it, like matter-server above.
  zwave-js-ui:
    image: zwavejs/zwave-js-ui:11.24.2
    container_name: zwave-js-ui
    restart: unless-stopped
    tty: true
    stop_signal: SIGINT
    environment:
      - TZ=America/New_York
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZWA-2_1CDBD45B3F78-if00:/dev/zwave
    volumes:
      - ${APPDATA_ROOT:?set APPDATA_ROOT in ~/fleet.env}/zwave-js-ui:/usr/src/app/store
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:3000:3000"
