# Read-only fleet docker proxy -- THIS FILE IS THE SECURITY POLICY.
#
# The fleet cockpit reads container state from EVERY fleet host through this
# HAProxy allowlist (tcp://<host>:2375), never the socket itself. This is a
# SEPARATE proxy from claude-remote-host's control proxy
# (haproxy-docker-proxy.cfg) -- that one keeps POST restart/stop/start/kill
# powers for the claude container and stays internal-only on
# claude-remote-host_docker-ctl (NAS-only, never published on a host port).
# This proxy is GET-only, deployed on every fleet host, and published on the
# tailnet so the cockpit can read remote hosts too. Two proxies, two trust
# levels -- do not merge them. Design: Obsidian
# Tech-Learning/Fleet-Cockpit-Multihost-Docker.
#
# Default-deny, method-aware. The ONLY things allowed are:
#
#   GET  /_ping /version                              -- docker CLI handshake
#   GET  /containers/json                              -- docker ps
#   GET  /containers/{id}/(json|logs|top|stats)         -- inspect / logs / top / stats
#
# Everything else 403s -- every POST/PUT/DELETE, with no exceptions (no
# restart/stop/start/kill here; that's the control proxy's job on the NAS
# only). Deliberately denied, and why it must stay that way:
#   - POST /containers/create        -- arbitrary Binds/Privileged = root on host
#   - POST /containers/{id}/exec     -- inherit any container's mounts
#   - GET/PUT /containers/{id}/archive, GET .../export
#                                    -- read/write any file in any container
#   - /images /build /volumes /networks /commit /plugins /session /swarm
# A generic path-prefix allow of /containers (what tecnativa's CONTAINERS=1
# flag does) would re-open create/exec/archive -- keep this an explicit,
# method-aware endpoint allowlist, never a path-prefix allow.
#
# Derived from claude-remote-host's haproxy-docker-proxy.cfg with the POST
# action-endpoint rule deleted -- this proxy has no write path at all.

global
    log stdout format raw daemon
    maxconn 500

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    # Also caps streaming reads (logs -f, stats) at 10m -- fine for our use.
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind :2375

    # Read-only endpoints. METH_GET matches GET and HEAD (CLI pings with HEAD).
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/(_ping|version)$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json$ }
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/(json|logs|top|stats)$ }

    # Everything else -- including all POST/PUT/DELETE, create, exec, archive.
    http-request deny

    default_backend dockerbackend
